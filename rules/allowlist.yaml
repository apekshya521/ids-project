# ── Suppressed system accounts (never alert on these) ─────────────────────
usernames:
  - SYSTEM
  - LOCAL SERVICE
  - NETWORK SERVICE
  - NT AUTHORITY\SYSTEM
  - NT AUTHORITY\LOCAL SERVICE
  - NT AUTHORITY\NETWORK SERVICE
  - ANONYMOUS LOGON
  - Window Manager
  - Font Driver Host
  - DWM-1
  - DWM-2
  - DWM-3
  - UMFD-0
  - UMFD-1
  - UMFD-2

# ── Trusted IPs (reduce confidence, not suppress) ──────────────────────────
trusted_ips:
  addresses: []            # add your monitoring server IPs here
  confidence_reduction: 0.4

# ── Business hours (outside = off_hours context boost) ────────────────────
business_hours:
  start: 8
  end: 19
  days: [0, 1, 2, 3, 4]   # 0=Monday, 4=Friday

# ── Per-device rule suppression ────────────────────────────────────────────
# Add device_id from .env DEVICE_1_ID value
# Example: if your DC fires 4672 constantly, suppress R012 for it
devices:
  local:
    suppress_rules: []
    trusted_services: []

  remote_win_01:
    suppress_rules: []
    trusted_services: []
    # trusted_services example:
    # - "BackupExecAgentAccelerator"

# ── Scheduled task paths that are always safe ─────────────────────────────
safe_task_paths:
  - "\\microsoft\\windows\\"
  - "\\microsoft\\office\\"
  - "\\microsoft\\visualstudio\\"

# ── Safe service paths ────────────────────────────────────────────────────
safe_service_paths:
  - "windows\\system32"
  - "windows\\syswow64"
  - "program files\\windows"